name: Missed something sensitive
description: Scrappy left a secret or personal detail visible.
title: "Missed: "
labels: ["missed-detection"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ Never paste the real value
        This is a public page. Make a **fake look-alike** with the same shape: same prefix, length and characters.
        For example, a real `ghp_9aZ…` token becomes `ghp_` plus 36 made-up letters and digits.
        If you already posted something real, **rotate or revoke it now**. Deleting the issue isn't enough.
  - type: textarea
    id: input
    attributes:
      label: Fake look-alike input
      description: A few lines around the value, with the value itself replaced by a fake of the same shape.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What Scrappy printed
      description: Run `scrappy sanitize` on the fake input above and paste the result.
      render: text
    validations:
      required: true
  - type: input
    id: kind
    attributes:
      label: What kind of value is it?
      placeholder: e.g. Datadog API key, Ethiopian national ID, internal session token
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Scrappy version
      description: Output of `scrappy --version`
    validations:
      required: true
